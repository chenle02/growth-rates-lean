version: v0.4
project:
  name: growth-rates-lean
  description: Lean 4 / Mathlib library on linear growth rates of real functions of a continuous time
    parameter -- Fekete's lemma in continuous time and rate transfer within a logarithmic error, a Fekete
    lemma with a logarithmic defect whose limit is identified as the supremum of explicitly corrected
    slopes (direct, delayed and multiplicative forms), uniform envelopes and joint limits over an order
    parameter, and explicit finite-time errors from cut, confinement and composition inequalities.
  authors:
  - Le Chen
  license: Apache-2.0
sources:
- title: Über die Verteilung der Wurzeln bei gewissen algebraischen Gleichungen mit ganzzahligen Koeffizienten
  authors:
  - Michael Fekete
  id: https://doi.org/10.1007/BF01504345
  type: article
  relationship: background
  note: Fekete's lemma for subadditive sequences (Math. Z. 17 (1923)). This standalone library proves
    continuous-time and logarithmic-defect variants; it does not formalize the paper.
related_formalizations:
- id: https://github.com/leanprover-community/mathlib4
  relationship: builds-on
  note: pinned in lake-manifest.json
status:
  scope: 'Formalized: Fekete''s lemma in continuous time for nonnegative, subadditive, locally bounded
    functions; rate transfer under a logarithmic comparison; a Fekete lemma with a logarithmic defect
    with the limit identified exactly, and its delayed and multiplicative forms; uniform envelopes and
    joint limits over an order parameter; finite-time errors from cut, confinement and composition inequalities.
    Excluded: a measurability-only continuous Fekete lemma, the general de Bruijn-Erdos theorem, convergence
    rates, and any derivation of the comparison, cut, confinement or composition inequalities for a concrete
    model.'
  sorry_count: 0
